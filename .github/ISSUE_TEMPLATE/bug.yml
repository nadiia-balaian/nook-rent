name: Bug
description: Report reproducible incorrect Nook.rent behavior.
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Local, deployed, Testnet, browser, and relevant commit.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Redaction check
      description: Confirm that logs contain no keys, exact addresses, or identity proofs.
    validations:
      required: true
